<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>linux-next Merge Run Report</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
       line-height: 1.6; color: #333; max-width: 1400px; margin: 0 auto; padding: 20px; }
h1 { margin-bottom: 10px; }
h2 { margin: 30px 0 15px; border-bottom: 2px solid #ddd; padding-bottom: 8px; }
h3 { margin: 20px 0 10px; }
.timestamp { color: #666; margin-bottom: 5px; }
.time-range { color: #888; font-size: 0.9em; margin-bottom: 20px; }
.summary { display: flex; gap: 15px; flex-wrap: wrap; margin: 20px 0; }
.stat { background: #f5f5f5; border-radius: 8px; padding: 15px 20px; min-width: 120px; }
.stat .number { font-size: 2em; font-weight: bold; }
.stat .label { color: #666; font-size: 0.9em; }
.stat.conflict .number { color: #9a6700; }
.stat.rerere .number { color: #0969da; }
.stat.build-fix .number { color: #cf222e; }
table { width: 100%; border-collapse: collapse; margin: 15px 0; }
th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #eee; }
th { background: #f5f5f5; font-weight: 600; }
tr:hover { background: #f9f9f9; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.85em;
          font-weight: 500; }
.badge.conflict { background: #fff8c5; color: #9a6700; }
.badge.build-fix { background: #ffebe9; color: #cf222e; }
.badge.rerere { background: #ddf4ff; color: #0969da; }
details { margin: 5px 0; }
summary { cursor: pointer; padding: 5px; font-weight: 500; }
summary:hover { background: #f5f5f5; }
.diff { background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 6px;
         overflow-x: auto; font-family: 'SFMono-Regular', Consolas, monospace;
         font-size: 0.85em; white-space: pre; margin: 10px 0; max-height: 600px;
         overflow-y: auto; }
.diff .add { color: #3fb950; }
.diff .del { color: #f85149; }
.diff .hdr { color: #79c0ff; }
.diff .ctx { color: #8b949e; }
nav { position: sticky; top: 0; background: white; padding: 10px 0; border-bottom: 1px solid #ddd;
       margin-bottom: 20px; z-index: 100; }
nav a { margin-right: 20px; text-decoration: none; color: #0969da; }
nav a:hover { text-decoration: underline; }
.controls { display: flex; gap: 15px; align-items: center; margin: 10px 0; }
.controls select { padding: 5px 10px; border: 1px solid #ccc; border-radius: 4px; }
.controls button { padding: 5px 12px; border: 1px solid #ccc; border-radius: 4px;
                    background: #f5f5f5; cursor: pointer; }
.controls button:hover { background: #e5e5e5; }
.empty-state { text-align: center; padding: 60px 20px; color: #666; }
.empty-state .icon { font-size: 3em; color: #2ea043; }
.empty-state p { font-size: 1.1em; margin-top: 10px; }
.category-count { background: #f5f5f5; border-radius: 12px; padding: 2px 10px;
                   font-size: 0.85em; color: #666; display: inline-block; margin-left: 8px; }
</style>
</head>
<body>
<h1>linux-next Merge Run Report</h1>
<p class="timestamp">Generated: 2026-10-03 05:29 UTC</p>

<div class="empty-state">
<div class="icon">&#10003;</div>
<p>No interventions were needed for this merge run.</p>
</div>
</body></html>
